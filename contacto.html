<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Reino Animal</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header>
      <h1>Formulario de Contacto</h1>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="vertebrados.html">Vertebrados</a></li>
          <li><a href="invertebrados.html">Invertebrados</a></li>
          <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="contenedor-formulario">
      <h2>¿Tienes dudas? Escríbenos</h2>
      <form action="#" method="POST" class="formulario-contacto">
        <div class="grupo-campo">
          <label for="nombre">Nombre Completo (solo letras):</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            required
            pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{3,40}$"
            title="El nombre debe contener solo letras y un mínimo de 3 caracteres."
          />
        </div>

        <div class="grupo-campo">
          <label for="telefono">Teléfono (Formato: 04XX-XXXXXXX):</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            required
            pattern="^0(412|414|424|416|426|241)-\d{7}$"
            title="Formato requerido: 0414-1234567"
          />
        </div>

        <div class="grupo-campo">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" name="correo" required />
        </div>

        <div class="grupo-campo">
          <label for="interes">Tema de mayor interés:</label>
          <select id="interes" name="interes" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="vertebrados">Animales Vertebrados</option>
            <option value="invertebrados">Animales Invertebrados</option>
            <option value="general">Ecología General</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="mensaje">Mensaje o Comentarios:</label>
          <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            required
            placeholder="Escribe tu mensaje aquí..."
          ></textarea>
        </div>

        <button type="submit" class="boton-enviar">Enviar Mensaje</button>
      </form>
    </main>

    <footer>
      <p>
        &copy; 2026 Electiva I - UPT de Valencia. Desarrollado con fines
        educativos.
      </p>
      <div class="redes">
        <a href="#">Facebook</a> | <a href="#">Instagram</a> |
        <a href="#">Twitter</a>
      </div>
    </footer>
  </body>
</html>
